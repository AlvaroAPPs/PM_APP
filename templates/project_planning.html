<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planning Gantt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
  <style>
    body { background: #f6f7fb; }
    .card { border: 1px solid #e7e9f0; border-radius: 16px; }
    .shadow-soft { box-shadow: 0 10px 30px rgba(16,24,40,.06); }
    #gantt { overflow-x: auto; }
    .gantt-empty { padding: 48px 16px; text-align: center; color: #6b7280; }
    .bar-wrapper.gantt-phase .bar { fill: #1f3a5f; }
    .bar-wrapper.gantt-manual .bar { fill: #3388f2; }
    .bar-wrapper.gantt-checklist .bar { fill: #157347; }
    .bar-wrapper.gantt-milestone .bar { fill: #dc9f0f; }
    .gantt .bar-wrapper .bar-progress { fill: #E8590C; }
  </style>
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
  <div class="container-fluid py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="fw-bold mb-0">Planning Gantt</h1>
        <div class="text-muted">
          Proyecto <span id="projectCode">{{ project_code }}</span> <span id="projectName"></span>
          <span id="projectProgressBadge" class="badge text-bg-primary ms-2 d-none"></span>
        </div>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <a href="/" class="btn btn-outline-secondary"><i class="bi bi-house me-1"></i>Menú principal</a>
        <a href="/estado-proyecto?q={{ project_code|urlencode }}" class="btn btn-outline-secondary"><i class="bi bi-box-arrow-up-right me-1"></i>Estado proyecto</a>
        <a href="/projects/{{ project_code|urlencode }}/checklist" class="btn btn-outline-secondary"><i class="bi bi-card-checklist me-1"></i>Checklist</a>
        <a id="printPdfLink" href="#" target="_blank" class="btn btn-outline-secondary"><i class="bi bi-file-earmark-pdf me-1"></i>Ver / Imprimir PDF</a>
      </div>
    </div>

    <div class="card shadow-soft mb-3">
      <div class="card-body d-flex flex-wrap gap-2 align-items-center">
        <button id="addTaskBtn" class="btn btn-dark"><i class="bi bi-plus-lg me-1"></i>Añadir tarea / hito</button>
        <div class="btn-group ms-auto" role="group" aria-label="Vista">
          <button type="button" class="btn btn-outline-secondary view-mode-btn" data-mode="Day">Día</button>
          <button type="button" class="btn btn-outline-secondary view-mode-btn" data-mode="Week">Semana</button>
          <button type="button" class="btn btn-outline-secondary view-mode-btn active" data-mode="Month">Mes</button>
        </div>
      </div>
    </div>

    <div class="card shadow-soft">
      <div class="card-body">
        <div id="gantt"></div>
      </div>
    </div>
  </div>

  <!-- Modal alta / edicion -->
  <div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="taskModalTitle">Añadir tarea</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="taskId">
          <div class="mb-2">
            <label class="form-label">Título</label>
            <input id="taskTitle" class="form-control" placeholder="Nombre de la tarea o hito">
          </div>
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label">Fecha inicio</label>
              <input id="taskStart" type="date" class="form-control">
            </div>
            <div class="col-6">
              <label class="form-label">Fecha fin</label>
              <input id="taskEnd" type="date" class="form-control">
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label">Tarea principal (para crear una subtarea)</label>
            <select id="taskParent" class="form-select">
              <option value="">Ninguna (tarea de primer nivel)</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">Progreso (<span id="taskProgressValue">0</span>%)</label>
            <input id="taskProgress" type="range" min="0" max="100" step="5" value="0" class="form-range">
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="taskMilestone">
            <label class="form-check-label" for="taskMilestone">Es un hito (fecha única, sin duración)</label>
          </div>
        </div>
        <div class="modal-footer">
          <div id="taskReorderBtns" class="me-auto d-none btn-group">
            <button id="taskMoveUpBtn" type="button" class="btn btn-outline-secondary" title="Subir"><i class="bi bi-arrow-up"></i></button>
            <button id="taskMoveDownBtn" type="button" class="btn btn-outline-secondary" title="Bajar"><i class="bi bi-arrow-down"></i></button>
          </div>
          <button id="taskDeleteBtn" class="btn btn-outline-danger d-none"><i class="bi bi-trash me-1"></i>Eliminar</button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button id="taskSaveBtn" class="btn btn-dark">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
  <script>window.PROJECT_CODE={{ project_code|tojson }};</script>
  <script src="/static/planning.js"></script>
</body>
</html>
