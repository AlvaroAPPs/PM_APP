<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configuración</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f7fb; }
    .card { border: 1px solid #e7e9f0; border-radius: 16px; }
    .shadow-soft { box-shadow: 0 10px 30px rgba(16,24,40,.06); }
  </style>
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
  <div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div>
        <h1 class="fw-bold mb-0">Configuración</h1>
        <div class="text-muted">Gestiona las configuraciones globales de la aplicación.</div>
      </div>
      <a href="/" class="btn btn-outline-secondary">Menú principal</a>
    </div>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <a class="nav-link" href="/configuracion">General</a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" aria-current="page" href="/configuracion/checklist">Checklist</a>
      </li>
    </ul>

    <div class="card shadow-soft mb-3">
      <div class="card-body">
        <h2 class="h5 mb-3">Plantilla global de checklist</h2>
        <div class="row g-2">
          <div class="col-md-2">
            <label class="form-label" for="newPhase">Fase</label>
            <input id="newPhase" list="phaseOptions" class="form-control" placeholder="Fase">
          </div>
          <div class="col-md-2">
            <label class="form-label" for="newRole">Rol</label>
            <input id="newRole" list="roleOptions" class="form-control" placeholder="Rol">
          </div>
          <div class="col-md-2">
            <label class="form-label" for="newWarehouse">Warehouse Type</label>
            <input id="newWarehouse" class="form-control" placeholder="Warehouse Type">
          </div>
          <div class="col-md-5">
            <label class="form-label" for="newTask">Tarea</label>
            <input id="newTask" class="form-control" placeholder="Tarea">
          </div>
          <div class="col-md-1 d-flex align-items-end">
            <button id="addTemplate" class="btn btn-dark w-100">Añadir</button>
          </div>
        </div>
        <datalist id="phaseOptions"></datalist>
        <datalist id="roleOptions"></datalist>
        <div class="form-text mt-2">Fase y rol permiten seleccionar valores existentes o escribir uno nuevo.</div>
      </div>
    </div>

    <div class="card shadow-soft">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-sm align-middle">
            <thead>
              <tr>
                <th>Fase</th>
                <th>Rol</th>
                <th>Warehouse Type</th>
                <th>Tarea</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="templateBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/checklist_config.js"></script>
</body>
</html>
