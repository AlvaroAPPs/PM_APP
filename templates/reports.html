<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Informes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f6f7fb; }
    .card { border: 1px solid #e7e9f0; border-radius: 16px; }
    .shadow-soft { box-shadow: 0 10px 30px rgba(16,24,40,.06); }
    .muted { color: #6b7280; }
  </style>
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
  <div class="container py-4">
    <div class="d-flex align-items-center gap-2 mb-3">
      <a href="/" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i> Volver al menú
      </a>
      <div>
        <h1 class="fw-bold mb-0">Informes</h1>
        <div class="muted">Genera informes PDF con gráficas a partir de los datos de proyectos.</div>
      </div>
    </div>

    <div class="card shadow-soft">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
          <div>
            <div class="fw-semibold fs-5">Cierre de proyectos</div>
            <div class="muted small" style="max-width: 520px;">
              Proyectos y horas cerradas por mes durante el año, y proyección acumulada
              hasta fin de año comparada con la proyección de hace 1 y 4 semanas.
            </div>
          </div>
          <form method="get" action="/informes/cierre-proyectos.pdf" class="d-flex align-items-end gap-2">
            <div>
              <label class="form-label small mb-1" for="reportYear">Año</label>
              <select class="form-select" id="reportYear" name="year">
                {% for y in years %}
                <option value="{{ y }}" {% if y == current_year %}selected{% endif %}>{{ y }}</option>
                {% endfor %}
              </select>
            </div>
            <button class="btn btn-primary" type="submit">
              <i class="bi bi-file-earmark-pdf me-1"></i> Generar PDF
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
