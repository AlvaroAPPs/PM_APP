<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist proyecto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f6f7fb; }
    .card { border: 1px solid #e7e9f0; border-radius: 16px; }
    .shadow-soft { box-shadow: 0 10px 30px rgba(16,24,40,.06); }
    textarea { min-width: 260px; }
    .phase-row th { background: #082b68 !important; color: white !important; text-align: center; }
  </style>
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
  <div class="container-fluid py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="fw-bold mb-0">Checklist proyecto</h1>
        <div class="text-muted">Proyecto <span id="projectCode">{{ project_code }}</span> <span id="projectName"></span></div>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <a href="/" class="btn btn-outline-secondary"><i class="bi bi-house me-1"></i>Menú principal</a>
        <a href="/estado-proyecto?q={{ project_code|urlencode }}" class="btn btn-outline-secondary"><i class="bi bi-box-arrow-up-right me-1"></i>Estado proyecto</a>
        <a href="/projects/{{ project_code|urlencode }}/indicators" class="btn btn-outline-secondary"><i class="bi bi-graph-up me-1"></i>Gráfico</a>
      </div>
    </div>

    <div class="card shadow-soft mb-3">
      <div class="card-body">
        <h2 class="h5">Añadir elemento del proyecto</h2>
        <div class="row g-2">
          <div class="col-md-2"><input id="newPhase" class="form-control" placeholder="Fase"></div>
          <div class="col-md-2"><input id="newRole" class="form-control" placeholder="Rol"></div>
          <div class="col-md-2"><input id="newWarehouse" class="form-control" placeholder="Warehouse Type"></div>
          <div class="col-md-4"><input id="newTask" class="form-control" placeholder="Tarea"></div>
          <div class="col-md-2"><button id="addItem" class="btn btn-dark w-100">Añadir</button></div>
        </div>
      </div>
    </div>

    <div class="card shadow-soft">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-sm align-middle">
            <thead>
              <tr>
                <th>Check</th>
                <th>Rol</th>
                <th>Warehouse Type</th>
                <th>Tarea</th>
                <th>Comentarios</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="checklistBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script>window.PROJECT_CODE={{ project_code|tojson }};</script>
  <script src="/static/checklist.js"></script>
</body>
</html>
